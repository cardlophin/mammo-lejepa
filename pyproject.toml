[project]
name = "mammo-lejepa"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "aiohttp>=3.14.3",
    "altair>=6.2.2",
    "dotenv>=0.9.9",
    "marimo>=0.24.2",
    "matplotlib>=3.11.2",
    "opencv-python>=5.0.0.93",
    "physionet>=0.1.5",
    "polars>=1.44.2",
    "pydicom>=3.0.2",
    "pylibjpeg>=2.0.1",
    "pylibjpeg-openjpeg>=2.4.0",
    "rich>=13.9.4",
    "timm>=1.0.29",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "typer>=0.15.1",
]

[project.scripts]
mammo-corpus = "mammo_lejepa.cli:app"
mammo-etl = "mammo_lejepa.vindr.cli:app"
mammo-ssl = "mammo_lejepa.ssl.cli:app"

[dependency-groups]
dev = [
    "lejepa",
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.2",
    "ruff>=0.9.4",
    "scipy>=1.18.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mammo_lejepa"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# Typer construye la CLI a partir de estas llamadas en los valores por
# defecto: es el patrón normal de la biblioteca, no un mutable-default real.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: integration tests that spin up a local server or exercise the full pipeline",
]

[tool.uv.sources]
lejepa = { git = "https://github.com/rbalestr-lab/lejepa" }

# CI en Linux: ruedas de torch solo-CPU (las CUDA por defecto pesan varios GB).
# macOS mantiene el índice de PyPI.
[tool.uv.sources.torch]
index = "pytorch-cpu"
marker = "sys_platform == 'linux'"

[tool.uv.sources.torchvision]
index = "pytorch-cpu"
marker = "sys_platform == 'linux'"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
